replicas: 1
minimumMasterNodes: 1
esJavaOpts: "-Xms512m -Xmx512m"
# Disable TLS/security for dev/demo environment
protocol: http
createCert: false
secret:
  enabled: false
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
volumeClaimTemplate:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 2Gi
readinessProbe:
  httpGet:
    path: /_cluster/health?local=true
    port: 9200
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 5

