name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: siddu99/sample-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Deploy to Kubernetes via Argo Rollouts
      run: |
        kubectl argo rollouts set image web-rollout \
          web=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n sample-app

    - name: Verify Rollout Status
      run: |
        kubectl argo rollouts get rollout web-rollout -n sample-app
